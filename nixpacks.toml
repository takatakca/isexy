# Coolify (Nixpacks) build for ISEXY: a static SPA built with npm.
# package-lock.json is the only lockfile; this pins npm and Node 22 so a stray
# bun/yarn/pnpm lockfile can never switch the package manager again.
# Coolify: build pack Nixpacks, "Is it a static site?" on, publish directory /dist.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]
