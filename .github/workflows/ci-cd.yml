# ISEXY CI/CD — ISEXY runs on TAKATAK V1 (Supabase project pcjfahhlozsseqqevimi).
#
# Every push / PR:
#   verify      install → typecheck → build → type-check every isexy-* edge function → lint report
#   migrations  apply supabase/isexy-migrations to a Postgres stand-in of V1 (dry run, apply,
#               re-run) with the guard that proves V1's public/auth/storage objects never change
#   rules       fail if anything could touch V1 outside ISEXY's lane (db push, bare functions deploy)
# Every push to main (after the above are green), each stage switching itself on once its
# secrets exist (GitHub → Settings → Secrets and variables → Actions):
#   1. ISEXY database: scripts/isexy/migrate.sh dry run, then --apply   (secret ISEXY_DB_URL)
#   2. ISEXY edge functions: deploy each isexy-* function by name        (secret SUPABASE_ACCESS_TOKEN)
#   3. Web: Render auto-deploys main; optional SSH publish                (ISEXY_DEPLOY_* secrets)
#   4. Smoke test the live site
# Never `supabase db push` here: V1's migration history belongs to takatak-v1.
# See docs/V1-MIGRATION.md.

name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pcjfahhlozsseqqevimi' }}
  SITE_URL: ${{ vars.ISEXY_SITE_URL || 'https://isexy.onrender.com' }}

jobs:
  verify:
    name: Verify (typecheck, build, functions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://pcjfahhlozsseqqevimi.supabase.co' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'pcjfahhlozsseqqevimi' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjamZhaGhsb3pzc2VxcWV2aW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMDA0NzQsImV4cCI6MjEwMDY3NjQ3NH0.jhy7N0I7uRjDt0Frzsu_F00lDL6cGr2ZxHPKsnoWY3Q' }}
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npm run build

      - name: Lint (report only — legacy findings are being paid down)
        continue-on-error: true
        run: npx eslint . --format stylish | tail -40

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check every edge function
        # Functions are bundled without the web app's package.json (as on
        # Supabase), so npm: specifiers resolve from the registry, not node_modules.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check supabase/functions/isexy-*/index.ts

  migrations:
    name: ISEXY migrations on a V1 stand-in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ISEXY_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Load the V1 stand-in
        run: psql "$ISEXY_DB_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/isexy/test/v1-mock.sql

      - name: Dry run (rolled back)
        run: scripts/isexy/migrate.sh --dry-run

      - name: Apply
        run: scripts/isexy/migrate.sh --apply

      - name: Re-run is a no-op
        run: scripts/isexy/migrate.sh | tee /tmp/rerun.txt && grep -q "up to date" /tmp/rerun.txt

  rules:
    name: V1 safety rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Nothing outside ISEXY's lane
        run: |
          set -euo pipefail
          fail=0
          if [ -d supabase/migrations ]; then
            echo "::error::supabase/migrations must not exist: ISEXY migrations live in supabase/isexy-migrations and run through scripts/isexy/migrate.sh"; fail=1
          fi
          if grep -rnE "supabase +db +push" .github/ scripts/ package.json | grep -vE ":[0-9]+:\s*#|echo "; then
            echo "::error::'supabase db push' is forbidden here (V1 migration history belongs to takatak-v1)"; fail=1
          fi
          if grep -rnE "functions +deploy *(--.*)?$" .github/ scripts/ package.json; then
            echo "::error::Deploy edge functions one by one by name (isexy-*), never a bare 'supabase functions deploy'"; fail=1
          fi
          for d in supabase/functions/*/; do
            n=$(basename "$d")
            case "$n" in isexy-*|_shared) ;; *) echo "::error::Edge function '$n' must be named isexy-<name>"; fail=1 ;; esac
          done
          if grep -rnE "public\.[a-z_]+" supabase/isexy-migrations/; then
            echo "::error::ISEXY migrations must not reference V1's public schema"; fail=1
          fi
          if grep -rniE "lovable" --include=*.ts --include=*.tsx --include=*.mjs --include=*.json --include=*.toml src supabase package.json vite.config.ts | grep -v "convert-lovable\|Lovable-era\|Lovable migration\|Replaces the Lovable"; then
            echo "::error::Lovable dependency found"; fail=1
          fi
          exit $fail

  deploy-supabase:
    name: Deploy ISEXY to TAKATAK V1 (isexy schema + isexy-* functions)
    needs: [verify, migrations, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ISEXY_DB_URL: ${{ secrets.ISEXY_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$ISEXY_DB_URL" ]; then echo "db=true" >> "$GITHUB_OUTPUT"; else
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ISEXY migrations skipped::Add the ISEXY_DB_URL secret (V1 session pooler URL) to apply supabase/isexy-migrations automatically."
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "fn=true" >> "$GITHUB_OUTPUT"; else
            echo "fn=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ISEXY functions skipped::Add the SUPABASE_ACCESS_TOKEN secret to deploy the isexy-* edge functions automatically."
          fi

      - name: Migrations — dry run on V1 (rolled back)
        if: steps.cfg.outputs.db == 'true'
        run: scripts/isexy/migrate.sh --dry-run

      - name: Migrations — apply to the isexy schema
        if: steps.cfg.outputs.db == 'true'
        run: scripts/isexy/migrate.sh --apply

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.fn == 'true'
        with:
          version: latest

      - name: Deploy isexy-* edge functions by name
        if: steps.cfg.outputs.fn == 'true'
        run: |
          set -euo pipefail
          for dir in supabase/functions/isexy-*/; do
            name="$(basename "$dir")"
            case "$name" in isexy-*) ;; *) echo "refusing to deploy $name"; exit 1 ;; esac
            echo "::group::$name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done

  deploy-web:
    name: Publish website (optional SSH host; Render deploys main itself)
    needs: [verify, deploy-supabase]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.ISEXY_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.ISEXY_DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.ISEXY_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.ISEXY_DEPLOY_PATH }}
      DEPLOY_KEY: ${{ secrets.ISEXY_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.ISEXY_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_PATH" ] && [ -n "$DEPLOY_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SSH publish skipped::Render (isexy.onrender.com) auto-deploys main. Add ISEXY_DEPLOY_* secrets only to also publish to an SSH host."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.cfg.outputs.enabled == 'true'
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}
        run: npm ci --no-audit --no-fund && npm run build

      - name: Publish (atomic swap, keeps previous release for rollback)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes"
          RELEASE="${DEPLOY_PATH%/}.releases/${GITHUB_SHA}"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE'"
          rsync -az --delete -e "$SSH" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE/"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            if [ -d '$DEPLOY_PATH' ] && [ ! -L '$DEPLOY_PATH' ]; then mv '$DEPLOY_PATH' '${DEPLOY_PATH%/}.pre-cicd'; fi
            ln -sfn '$RELEASE' '${DEPLOY_PATH%/}.next' && mv -Tf '${DEPLOY_PATH%/}.next' '$DEPLOY_PATH'
            ls -1dt '${DEPLOY_PATH%/}.releases'/* | tail -n +6 | xargs -r rm -rf"
          echo "Published ${GITHUB_SHA::7}."

  smoke-test:
    name: Smoke test live site
    needs: deploy-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://pcjfahhlozsseqqevimi.supabase.co' }}
    steps:
      - name: Site and SPA routes respond
        run: |
          set -euo pipefail
          for path in / /auth /discover /knowledge-base /faq; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$SITE_URL$path")
            echo "$path → $code"
            [ "$code" = "200" ] || { echo "::error::$SITE_URL$path returned $code"; exit 1; }
          done

      - name: ISEXY edge functions reachable
        run: |
          for fn in isexy-ai-chat isexy-payments-gate-status; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$SUPABASE_URL/functions/v1/$fn")
            echo "$fn OPTIONS → $code"
            [ "$code" = "200" ] || echo "::warning::$fn is not deployed yet (HTTP $code)."
          done
